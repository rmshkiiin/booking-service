services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://booking:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}@db:5432/booking
      SECRET_KEY: ${SECRET_KEY:?задай SECRET_KEY в .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт базы наружу не открыт: к ней можно подключиться только из контейнера api.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
